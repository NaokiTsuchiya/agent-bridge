name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole
          coverage: pcov

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Restored after `composer install`, which re-extracts the package directory
      # this binary lives inside. The Mago composer package is a shim that fetches
      # a ~8.8MB native binary on first run.
      - name: Cache Mago binary
        uses: actions/cache@v4
        with:
          path: vendor/carthage-software/mago/composer/bin
          key: mago-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      # No logged-in Claude Code and no secrets are involved, so the compile belongs here rather
      # than in a deploy job. It runs before the tests because those resolve from what it writes.
      - run: composer compile

      - name: Compiled scripts stay out of git
        run: |
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^.. var/'; then
            echo 'The compile wrote something git can see; var/ must be ignored.' >&2
            exit 1
          fi

      # One run for every suite, with coverage, on every matrix leg: the report then covers
      # everything the suites cover, and each supported PHP version is measured.
      #
      # The integration group needs a binary that speaks the CLI's protocol, not a logged-in one.
      # It is aimed at the fake it runs here, where no Claude Code exists; the same command without
      # the variable is what a developer runs locally to check the fake against the real CLI.
      - name: Every test suite with coverage, against the fake CLI
        run: composer test:coverage
        env:
          AGENT_BRIDGE_CLAUDE_BIN: ${{ github.workspace }}/fake-claude/bin/claude

      # Uploaded from one leg only: the legs run the same tests, and a second upload of the same
      # numbers would have Codecov count them twice.
      #
      # No token: the repository is public, so the action uploads tokenless. Failure to upload is
      # left non-fatal (the action's default) because a rate-limited tokenless upload must not turn
      # a green suite red; the paths this step depends on are pinned by CoverageReportingTest.
      - name: Upload coverage to Codecov
        if: matrix.php == '8.5'
        uses: codecov/codecov-action@v7
        with:
          files: var/coverage/clover.xml
          disable_search: true

      - run: composer lint

      - run: composer analyze

      - run: composer fmt-check

  # The single check branch protection is meant to require. Naming the matrix legs there instead
  # would tie the settings to the PHP versions: adding 8.6 would leave the new leg unguarded, and
  # dropping 8.4 would leave behind a required check that never reports and blocks every PR. This
  # job's name never changes, and it depends on the whole matrix, so it is green only when every
  # leg is.
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest

    # `always()` is what makes this a gate: without it the job is skipped when the matrix fails,
    # and a skipped required check counts as passing.
    needs: checks
    if: always()

    steps:
      # `needs.checks.result` is the matrix taken as a whole — `success` only when every leg
      # succeeded, otherwise `failure`, `cancelled` or `skipped`.
      - name: Every matrix leg succeeded
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          [ "$RESULT" = 'success' ]
