# The CI matrix runs 8.4 and 8.5; analysis targets the lower bound so that
# anything accepted here is also accepted on 8.5.
php-version = "8.4"

[source]
paths = ["src", "tests", "fake-claude", "fake-claude-tests", "stub-slack", "stub-slack-tests"]
# `includes` is also how mago learns about ext-swoole: it resolves classes from source, not from
# loaded extensions, so `Swoole\Coroutine\Channel` and friends are "not found" without stubs. That
# is what `swoole/ide-helper` is in require-dev for — it ships nothing but stub sources and has no
# autoload section, so it is never loaded at runtime and cannot shadow the real extension.
includes = ["vendor"]

[linter]
# Fail on anything the linter reports, down to notes.
minimum-fail-level = "note"
# Integrations add rules for a specific library, so they are enabled per
# dependency. PHPUnit is in require-dev and drives everything under tests/;
# the framework integrations mago also ships (Psl, Symfony, Laravel, ...)
# target libraries this project does not use, and enabling one of those would
# demand rewriting plain PHP calls into an API that is not installed.
integrations = ["phpunit"]

# Every rule mago ships with off by default is turned on here one by one, so the
# strictness lives in this file rather than in a `--pedantic` flag (which ignores
# this file wholesale, including minimum-fail-level and the integration list).
# The two exceptions are at the bottom, each with its reason.
[linter.rules]
# `redundant-static` (below) rejects `static::` inside a final class, so the
# PHPUnit assertion style is pinned to `self::` to match it.
assertion-style = { enabled = true, style = "self" }
ambiguous-constant-access = { enabled = true }
ambiguous-function-call = { enabled = true }
method-name = { enabled = true }
prefer-datetimeimmutable-create-from-timestamp = { enabled = true }
no-redundant-else = { enabled = true }
no-redundant-variable = { enabled = true }
no-dead-store = { enabled = true }
no-unused-static = { enabled = true }
no-unused-global = { enabled = true }
no-unused-closure-capture = { enabled = true }
redundant-static = { enabled = true }
no-negated-ternary = { enabled = true }
no-is-null = { enabled = true }
no-iterator-to-array-in-foreach = { enabled = true }
no-assign-in-argument = { enabled = true }
no-fully-qualified-global-class-like = { enabled = true }
no-fully-qualified-global-constant = { enabled = true }
no-fully-qualified-global-function = { enabled = true }
prefer-early-return = { enabled = true }
variable-name = { enabled = true }
no-array-accumulation-in-loop = { enabled = true }
prefer-array-spread = { enabled = true }
no-parameter-shadowing = { enabled = true }
no-inline = { enabled = true }
no-side-effects-with-declarations = { enabled = true }
property-name = { enabled = true }
require-namespace = { enabled = true }
sorted-integer-keys = { enabled = true }
string-style = { enabled = true }
no-literal-namespace-string = { enabled = true }
no-short-bool-cast = { enabled = true }
no-alternative-syntax = { enabled = true }
prefer-self-return-type = { enabled = true }
switch-continue-to-break = { enabled = true }
no-null-property-init = { enabled = true }
prefer-explode-over-preg-split = { enabled = true }
disallowed-type-instantiation = { enabled = true }

missing-docs = { enabled = true }
prefer-test-attribute = { enabled = true }

# `yoda-conditions` is the one rule left off: comparisons are written in reading
# order (`$x === ''`), which this rule would invert.
yoda-conditions = { enabled = false }

[analyzer]
minimum-fail-level = "note"
analyze-dead-code = true
find-overly-wide-return-types = true
check-throws = true
# PHPUnit signals a failed assertion by throwing; every assertion in every test
# would otherwise need a @throws tag for the framework's own control flow.
unchecked-exceptions = ["PHPUnit\\Framework\\Exception"]
check-missing-type-hints = true
check-closure-missing-type-hints = true
check-arrow-function-missing-type-hints = true
allow-implicit-pipe-callable-types = false
check-missing-override = true
check-property-initialization = true
check-use-statements = true
check-experimental = true
check-name-casing = true
find-unused-parameters = true
enforce-class-finality = true
require-api-or-internal = true
strict-list-index-checks = true
strict-array-index-existence = true
allow-array-truthy-operand = false
allow-side-effects-in-conditions = false
no-boolean-literal-comparison = true
